name: Qualification statement checks

on:
  pull_request:
    paths:
      - scripts/qualification-statement.mjs
      - scripts/qualification-statement.test.mjs
      - scripts/qualification-statement-v3.mjs
      - scripts/qualification-statement-v3.test.mjs
      - scripts/build-private-assets-index.mjs
      - scripts/verify-private-assets.mjs
      - scripts/verify-private-assets.test.mjs
      - scripts/verify-private-assets-v3.mjs
      - scripts/verify-private-assets-v3.test.mjs
      - .github/workflows/release-qualification.yml
      - .github/workflows/qualification-statement.yml
  workflow_dispatch:

permissions: {}

jobs:
  statement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the public event commit
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/true-line/soul-adapters.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Test exact-byte release inputs
        run: node --test scripts/qualification-statement.test.mjs scripts/qualification-statement-v3.test.mjs scripts/verify-private-assets.test.mjs scripts/verify-private-assets-v3.test.mjs
