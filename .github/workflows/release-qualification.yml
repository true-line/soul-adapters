name: Release protected adapter qualification

on:
  workflow_dispatch:
    inputs:
      evidence_commit:
        description: Exact soul-conformance commit carrying reviewed candidate evidence
        required: true
        type: string
      evidence_dir:
        description: Directory under reports/ with qualification and host envelopes
        required: true
        type: string
      expires_at:
        description: Qualification expiry as a UTC RFC 3339 instant
        required: true
        type: string

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qualification-release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      MACHINE_COMMIT: 52c92c5d90ef0e61a4c717b3121a192ed3898c6d
    steps:
      - name: Fetch exact release source
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/true-line/soul-adapters.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Fetch reviewed evidence and Machine verifier
        env:
          EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_DIR" =~ ^reports/[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "/$EVIDENCE_DIR/" != *"/../"* ]]
          [[ "/$EVIDENCE_DIR/" != *"/./"* ]]
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/machine" "$RUNNER_TEMP/conformance"
          git -C "$RUNNER_TEMP/machine" init --quiet
          git -C "$RUNNER_TEMP/machine" -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/true-line/agent-bot-machine.git "$MACHINE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/machine" rev-parse FETCH_HEAD)" = "$MACHINE_COMMIT"
          git -C "$RUNNER_TEMP/machine" checkout --quiet --detach FETCH_HEAD
          test -s "$RUNNER_TEMP/machine/trust/qualification/owner-root.hex"
          test -s "$RUNNER_TEMP/machine/trust/qualification/owner-key-id.txt"
          git -C "$RUNNER_TEMP/conformance" init --quiet
          git -C "$RUNNER_TEMP/conformance" -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/true-line/soul-conformance.git "$EVIDENCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/conformance" rev-parse FETCH_HEAD)" = "$EVIDENCE_COMMIT"
          for name in qualification.json protected-envelope.json cooperative-envelope.json policy-envelope.json; do
            git -C "$RUNNER_TEMP/conformance" show "$EVIDENCE_COMMIT:$EVIDENCE_DIR/$name" > "$RUNNER_TEMP/evidence/$name"
            test -s "$RUNNER_TEMP/evidence/$name"
          done
      - name: Verify fixed owner policy and physical host reports
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/machine"
          go run ./cmd/mm-qualification-preflight \
            -owner-root trust/qualification/owner-root.hex \
            -owner-key-id "$(cat trust/qualification/owner-key-id.txt)" \
            -policy-envelope "$RUNNER_TEMP/evidence/policy-envelope.json" \
            -qualification "$RUNNER_TEMP/evidence/qualification.json" \
            -protected-envelope "$RUNNER_TEMP/evidence/protected-envelope.json" \
            -cooperative-envelope "$RUNNER_TEMP/evidence/cooperative-envelope.json" \
            > "$RUNNER_TEMP/evidence/preflight.json"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Prepare pinned Sigstore root and exact Statement
        env:
          EXPIRES_AT: ${{ inputs.expires_at }}
        run: |
          set -euo pipefail
          cosign trusted-root create --with-default-services --out "$RUNNER_TEMP/evidence/trusted-root.json"
          node scripts/qualification-statement.mjs \
            "$RUNNER_TEMP/evidence/qualification.json" \
            "$RUNNER_TEMP/evidence/preflight.json" \
            "$RUNNER_TEMP/evidence/policy-envelope.json" \
            "$GITHUB_SHA" "$EXPIRES_AT" \
            > "$RUNNER_TEMP/evidence/statement.json"
          node - "$RUNNER_TEMP/evidence/policy-envelope.json" "$RUNNER_TEMP/evidence/trusted-root.json" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const envelope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const policy = JSON.parse(Buffer.from(envelope.policy_base64url, 'base64url').toString('utf8'));
          const root = fs.readFileSync(process.argv[3]);
          const digest = 'sha256:' + crypto.createHash('sha256').update(root).digest('hex');
          if (policy.release_workflow.trust_root_sha256 !== digest) {
            throw new Error('Sigstore trusted root differs from owner-signed policy');
          }
          NODE
      - name: Sign exact release Statement
        run: |
          set -euo pipefail
          cosign attest-blob \
            --statement "$RUNNER_TEMP/evidence/statement.json" \
            --bundle "$RUNNER_TEMP/evidence/bundle.json" \
            --yes "$RUNNER_TEMP/evidence/qualification.json"
          cosign verify-blob-attestation "$RUNNER_TEMP/evidence/qualification.json" \
            --bundle "$RUNNER_TEMP/evidence/bundle.json" \
            --trusted-root "$RUNNER_TEMP/evidence/trusted-root.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/true-line/soul-adapters/.github/workflows/release-qualification.yml@refs/heads/main"
          sha256sum "$RUNNER_TEMP/evidence/"*.json > "$RUNNER_TEMP/evidence/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-release-candidate
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
